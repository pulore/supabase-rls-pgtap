# Runs the database tests on every push to main and every pull request,
# against a fresh local Postgres with every migration and the seed applied.
# The CLI version is pinned, so a new release arrives as a reviewed change.
name: Database tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 3.1.0
      - run: supabase db start
      - run: supabase test db
